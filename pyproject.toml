[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-skill-lab"
version = "0.1.0"
description = "AgenticHumanoid: Atlas scene reconstruction, shared ScaleBFM control and auditable skill exploration"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.1", "scipy==1.17.0", "torch==2.11.0", "mujoco==3.11.0", "hydra-core==1.3.2", "loguru==0.7.3", "PyYAML==6.0.3", "imageio==2.37.2", "imageio-ffmpeg==0.6.0", "Pillow==12.3.0", "opencv-python-headless==4.13.0.92", "openai==2.8.1"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]
plots = ["matplotlib==3.10.8"]
reconstruction = ["trimesh==4.11.1", "usd-core==25.5", "requests>=2.32.5", "open3d==0.19.0", "matplotlib==3.10.8"]

[project.scripts]
agentic-humanoid = "humanoid_skill_lab.cli:main"
humanoid-lab = "humanoid_skill_lab.cli:main"

[tool.setuptools.packages.find]
include = ["humanoid_skill_lab*", "scene_reconstruction*"]

[tool.setuptools.package-data]
humanoid_skill_lab = ["configs/*.json", "scenes/*.xml"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["humanoid_skill_lab/tests"]
markers = ["integration: requires pinned ScaleBFM assets and MuJoCo"]
