<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Atlas room preview</title><style>body{margin:0;background:#172326;color:white;font:14px sans-serif;overflow:hidden}#bar{position:absolute;top:12px;left:12px;z-index:1;background:#172326dd;padding:12px;border-radius:6px}select{margin-left:8px}#note{position:absolute;bottom:10px;left:12px;background:#172326dd;padding:8px;max-width:90vw}</style><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/","@sparkjsdev/spark":"./vendor/spark/spark.module.js"}}</script></head><body><div id="bar">World Labs Atlas <select id="views"></select><span id="status"> Loading splats…</span></div><div id="note">Drag to orbit · Wheel to zoom · WASD to move · Q/E down/up<br>Estimated scale. Unseen entrance and other generated surfaces are inferred. Visual preview; physics runs in MuJoCo/Isaac Lab.</div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {SparkRenderer,SplatMesh} from '@sparkjsdev/spark';
const scene=new THREE.Scene();scene.background=new THREE.Color('#172326');
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.01,100);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=false;
scene.add(new SparkRenderer({renderer}));const splats=new SplatMesh({url:'./room.spz',lod:false});scene.add(splats);
const frames=await(await fetch('./cameras.json')).json();const menu=document.querySelector('#views');frames.forEach(f=>menu.add(new Option(f.name,f.name)));
window.setView=(name)=>{const f=frames.find(f=>f.name===name);if(!f)throw Error('Unknown view');const c=f.camera,e=c.extrinsics,k=c.intrinsics;camera.position.fromArray(e.position);camera.quaternion.fromArray(e.quaternion);camera.fov=THREE.MathUtils.radToDeg(2*Math.atan(k.height/(2*k.fy)));camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();camera.up.set(0,1,0).applyQuaternion(camera.quaternion);const forward=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);controls.target.copy(camera.position).addScaledVector(forward,2);controls.update();menu.value=name;};
window.viewerState=()=>({position:camera.position.toArray(),quaternion:camera.quaternion.toArray(),view:menu.value});
menu.onchange=()=>window.setView(menu.value);window.setView('source_006');
const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let last=performance.now();
renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;const f=new THREE.Vector3();camera.getWorldDirection(f);f.y=0;f.normalize();const right=new THREE.Vector3().crossVectors(f,new THREE.Vector3(0,1,0));const delta=new THREE.Vector3();if(keys.has('w'))delta.add(f);if(keys.has('s'))delta.sub(f);if(keys.has('d'))delta.add(right);if(keys.has('a'))delta.sub(right);if(keys.has('e'))delta.y+=1;if(keys.has('q'))delta.y-=1;delta.multiplyScalar(dt*.9);camera.position.add(delta);controls.target.add(delta);controls.update();renderer.render(scene,camera);});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
await splats.initialized;
if(new URLSearchParams(location.search).has('inspect'))window.inspectSplats=(options)=>{const rows=[];splats.packedSplats.forEachSplat((i,p,scale,q,opacity,c)=>{const a=[p.x,p.y,p.z];if(a.every((v,j)=>v>=options.min[j]&&v<=options.max[j])&&opacity>=options.minOpacity&&Math.max(c.r,c.g,c.b)-Math.min(c.r,c.g,c.b)<=options.maxColorRange&&(c.r+c.g+c.b)/3>=options.minBrightness)rows.push([...a,c.r,c.g,c.b]);});return rows;};
window.viewerReady=true;window.splatCount=splats.packedSplats?.numSplats ?? splats.splats?.getNumSplats?.() ?? 0;document.querySelector('#status').textContent=' '+window.splatCount.toLocaleString()+' splats · ready';
</script></body></html>
